<div
  class="home-wrapper"
  [class.dark-class]="isComponentBGDark"
  [class.white-class]="!isComponentBGDark"
>
  <section appScrollReveal id="about">
    <app-about></app-about>
  </section>

  <ng-lottie
    [class.active-red-waves]="isComponentBGDark"
    [class.inactive-red-waves]="!isComponentBGDark"
    [options]="waveRedoptions"
    width="30vw"
    height="30vh"
  ></ng-lottie>
  <ng-lottie
    [class.inactive-green-waves]="isComponentBGDark"
    [class.active-green-waves]="!isComponentBGDark"
    [options]="waveGreenoptions"
    width="30vw"
    height="30vh"
  ></ng-lottie>

  <section id="projects">
    <app-projects></app-projects>
  </section>

  <section>
    <app-certificates></app-certificates>
  </section>
</div>
